<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Ping Pong · Bot · Multiball</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="theme-black">
  <main class="app">
    <header class="hud">
      <div class="stat">
        <span class="stat-label">ВЫ</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat stat-center">
        <span class="ball-count" id="ballCount">1</span>
        <span class="stat-label">ШАРИК</span>
      </div>
      <div class="stat">
        <span class="stat-label">БОТ</span>
        <span class="stat-value" id="botScore">0</span>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="game"></canvas>

      <div class="overlay" id="overlay">
        <div class="overlay-content" id="overlayContent">
          <div class="overlay-icon">◉</div>
          <h2 id="overlayTitle">PING PONG</h2>
          <p id="overlaySub">Отбивай — шарики размножаются</p>
          <button id="overlayBtn" class="cta" type="button">ИГРАТЬ</button>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn" id="restartBtn" type="button">
        <span class="nav-icon">↻</span>
        <span class="nav-text">Заново</span>
      </button>
      <button class="nav-btn" id="themeBtn" type="button">
        <span class="nav-icon">◐</span>
        <span class="nav-text">Цвета</span>
      </button>
    </div>
  </main>

  <div class="modal" id="colorModal" hidden>
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3>Выбор цвета</h3>
      <div class="color-options">
        <button type="button" class="color-dot selected" data-theme="black"   title="Чёрный"></button>
        <button type="button" class="color-dot" data-theme="blue"    title="Голубой"></button>
        <button type="button" class="color-dot" data-theme="pink"    title="Розовый"></button>
        <button type="button" class="color-dot" data-theme="purple"  title="Фиолетовый"></button>
        <button type="button" class="color-dot" data-theme="green"   title="Зелёный"></button>
        <button type="button" class="color-dot" data-theme="orange"  title="Оранжевый"></button>
        <button type="button" class="color-dot" data-theme="red"     title="Красный"></button>
        <button type="button" class="color-dot" data-theme="yellow"  title="Жёлтый"></button>
        <button type="button" class="color-dot" data-theme="teal"    title="Бирюзовый"></button>
        <button type="button" class="color-dot" data-theme="indigo"  title="Индиго"></button>
        <button type="button" class="color-dot" data-theme="lime"    title="Лайм"></button>
        <button type="button" class="color-dot" data-theme="cyan"    title="Циан"></button>
        <button type="button" class="color-dot" data-theme="magenta" title="Маджента"></button>
      </div>
      <button id="closeColors" class="cta" type="button">ГОТОВО</button>
    </div>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>
