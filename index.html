<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Ping Pong</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="theme-black">
  <main class="app">
    <header class="hud">
      <div class="score-box">
        <span class="label">СЧЁТ</span>
        <span id="score">0</span>
      </div>
      <div class="score-box">
        <span class="label">РЕКОРД</span>
        <span id="best">0</span>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="game"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">PING PONG</h2>
        <p id="overlaySub">Двигай платформу — отбивай шарик</p>
        <button id="overlayBtn" class="cta">Играть</button>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item" id="restartBtn">
        <span>↻</span>
        <small>Заново</small>
      </div>
      <div class="nav-item" id="themeBtn">
        <span>◐</span>
        <small>Цвета</small>
      </div>
    </div>
  </main>

  <!-- модалка выбора цвета -->
  <div class="modal" id="colorModal" hidden>
    <div class="modal-sheet">
      <h3>Выбор цвета</h3>
      <div class="color-options">
        <div class="color-dot selected" data-theme="black"   title="Чёрный"></div>
        <div class="color-dot" data-theme="blue"    title="Голубой"></div>
        <div class="color-dot" data-theme="pink"    title="Розовый"></div>
        <div class="color-dot" data-theme="purple"  title="Фиолетовый"></div>
        <div class="color-dot" data-theme="green"   title="Зелёный"></div>
        <div class="color-dot" data-theme="orange"  title="Оранжевый"></div>
        <div class="color-dot" data-theme="red"     title="Красный"></div>
        <div class="color-dot" data-theme="yellow"  title="Жёлтый"></div>
        <div class="color-dot" data-theme="teal"    title="Бирюзовый"></div>
        <div class="color-dot" data-theme="indigo"  title="Индиго"></div>
        <div class="color-dot" data-theme="lime"    title="Лайм"></div>
        <div class="color-dot" data-theme="cyan"    title="Циан"></div>
        <div class="color-dot" data-theme="magenta" title="Маджента"></div>
      </div>
      <button id="closeColors" class="cta">Готово</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
