<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#071018">
  <title>Calculator</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="theme-blue">
  <div class="particles" aria-hidden="true"></div>

  <main class="app">
    <header class="brand">
      <div class="logo">÷</div>
      <h1>CALCULATOR</h1>
      <p>SMART TOOLS. DARK STYLE.</p>
    </header>

    <section class="calculator">
      <div class="section-label">
        <span class="status-dot"></span>
        КАЛЬКУЛЯТОР
        <span class="live">ONLINE</span>
      </div>

      <div class="screen">
        <div id="previous"></div>
        <div id="display" aria-live="polite">0</div>
      </div>

      <div class="buttons">
        <button class="special" data-action="clear">AC</button>
        <button class="special" data-action="delete">⌫</button>
        <button class="special" data-action="percent">%</button>
        <button class="operator" data-value="/">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button data-action="sign">+/−</button>
        <button data-value="0" class="zero">0</button>
        <button data-value=".">.</button>
        <button class="equal" data-action="calculate">=</button>
      </div>

      <div class="footer">
        <span>CALC SYSTEM</span>
        <span>● SECURE INTERFACE</span>
      </div>
    </section>

    <div class="bottom-nav">
      <div class="nav-item active">
        <span>⌗</span>
        <small>Калькулятор</small>
      </div>
      <div class="nav-item" id="historyBtn">
        <span>◷</span>
        <small>История</small>
      </div>
      <div class="nav-item" id="themeBtn">
        <span>◐</span>
        <small>Цвета</small>
      </div>
    </div>

    <section class="history-panel" id="historyPanel" hidden>
      <h3>История вычислений</h3>
      <div id="historyList">Пока нет вычислений</div>
      <button id="clearHistory" class="history-clear">
        Очистить историю
      </button>
    </section>

    <section class="color-panel" id="colorPanel" hidden>
      <h3>Выбор цвета</h3>
      <div class="color-options">
        <div class="color-dot selected" data-theme="blue"   title="Голубая"></div>
        <div class="color-dot" data-theme="pink"   title="Розовая"></div>
        <div class="color-dot" data-theme="purple" title="Фиолетовая"></div>
        <div class="color-dot" data-theme="green"  title="Зелёная"></div>
        <div class="color-dot" data-theme="orange" title="Оранжевая"></div>
      </div>
    </section>

    <p class="copyright">DESIGNED FOR TELEGRAM MINI APPS</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
